[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cfd-agent-mvp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "cadquery==2.7.0", "ansys-fluent-core==0.42.1", "httpx>=0.27,<1", "PyYAML>=6,<7"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
cfd-agent = "cfd_agent.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
